services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - app-net

  backend:
    build:
      context: ./backend
    image: ghcr.io/khadzaragov/film-react-nest-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      LOG_FORMAT: ${LOG_FORMAT}
      DATABASE_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/khadzaragov/film-react-nest-frontend:latest
    restart: unless-stopped
    volumes:
      - frontend-dist:/frontend-dist
    networks:
      - app-net

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/khadzaragov/film-react-nest-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-net

volumes:
  pgdata:
  frontend-dist:

networks:
  app-net:
    driver: bridge
